hostname CORE-SW1
no ip domain-lookup
ip routing
!
spanning-tree mode rapid-pvst
spanning-tree vlan 10,20,30,40,50 priority 4096
!
vlan 999
 name BLACKHOLE-NATIVE
!
vlan 10
 name HQ-Users
!
vlan 20
 name RemoteA-Users
!
vlan 30
 name RemoteB-Users
!
vlan 40
 name FinTech-Colo
!
vlan 50
 name Management
!
interface Vlan10
 description Gateway for HQ-Users
 ip address 172.16.0.1 255.255.255.0
 ip access-group PROTECT-MGMT in
 no shutdown
!
interface Vlan20
 description Gateway for RemoteA-Users
 ip address 172.16.1.1 255.255.255.128
 ip access-group PROTECT-MGMT in
 no shutdown
!
interface Vlan30
 description Gateway for RemoteB-Users
 ip address 172.16.1.129 255.255.255.128
 ip access-group PROTECT-MGMT in
 no shutdown
!
interface Vlan40
 description Gateway for FinTech-Colo
 ip address 172.16.2.1 255.255.255.192
 ip access-group PROTECT-MGMT in
 no shutdown
!
interface Vlan50
 description Gateway for Management
 ip address 172.16.2.65 255.255.255.224
 no shutdown
!
interface GigabitEthernet0/1
 description Trunk uplink to distribution/core switch
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,50
 switchport trunk native vlan 999
 switchport nonegotiate
 no shutdown
!
ip access-list extended PROTECT-MGMT
 remark Restrict access to the management subnet
 deny ip any 172.16.2.64 0.0.0.31
 permit ip any any
!
router ospf 1
 router-id 1.1.1.1
 passive-interface default
 network 172.16.0.0 0.0.0.255 area 0
 network 172.16.1.0 0.0.0.127 area 0
 network 172.16.1.128 0.0.0.127 area 0
 network 172.16.2.0 0.0.0.63 area 0
 network 172.16.2.64 0.0.0.31 area 0
!
end
