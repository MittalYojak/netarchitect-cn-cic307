hostname CORE-SW1
no ip domain-lookup
ip routing
!
spanning-tree mode rapid-pvst
spanning-tree vlan 10,20,30,40,50,60 priority 4096
!
vlan 999
 name BLACKHOLE-NATIVE
!
vlan 10
 name Delhi-IoT
!
vlan 20
 name Mumbai-IoT
!
vlan 30
 name Bengaluru-IoT
!
vlan 40
 name Chennai-IoT
!
vlan 50
 name Cloud-VPC
!
vlan 60
 name Management
!
interface Vlan10
 description Gateway for Delhi-IoT
 ip address 10.100.0.1 255.255.252.0
 ip access-group PROTECT-MGMT in
 no shutdown
!
interface Vlan20
 description Gateway for Mumbai-IoT
 ip address 10.100.4.1 255.255.254.0
 ip access-group PROTECT-MGMT in
 no shutdown
!
interface Vlan30
 description Gateway for Bengaluru-IoT
 ip address 10.100.6.1 255.255.254.0
 ip access-group PROTECT-MGMT in
 no shutdown
!
interface Vlan40
 description Gateway for Chennai-IoT
 ip address 10.100.8.1 255.255.254.0
 ip access-group PROTECT-MGMT in
 no shutdown
!
interface Vlan50
 description Gateway for Cloud-VPC
 ip address 10.100.10.1 255.255.255.0
 ip access-group PROTECT-MGMT in
 no shutdown
!
interface Vlan60
 description Gateway for Management
 ip address 10.100.11.1 255.255.255.192
 no shutdown
!
interface GigabitEthernet0/1
 description Trunk uplink to distribution/core switch
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,50,60
 switchport trunk native vlan 999
 switchport nonegotiate
 no shutdown
!
ip access-list extended PROTECT-MGMT
 remark Restrict access to the management subnet
 deny ip any 10.100.11.0 0.0.0.63
 permit ip any any
!
router ospf 1
 router-id 1.1.1.1
 passive-interface default
 network 10.100.0.0 0.0.3.255 area 0
 network 10.100.4.0 0.0.1.255 area 0
 network 10.100.6.0 0.0.1.255 area 0
 network 10.100.8.0 0.0.1.255 area 0
 network 10.100.10.0 0.0.0.255 area 0
 network 10.100.11.0 0.0.0.63 area 0
!
end
