hostname ACCESS-SW1
no ip domain-lookup
!
spanning-tree mode rapid-pvst
!
vlan 999
 name BLACKHOLE-NATIVE
!
vlan 10
 name Students
!
vlan 20
 name Staff
!
vlan 30
 name Labs
!
vlan 40
 name Wireless-APs
!
vlan 50
 name VoIP
!
vlan 60
 name Servers
!
vlan 70
 name Management
!
interface Vlan70
 ip address 10.10.8.194 255.255.255.224
 no shutdown
!
ip default-gateway 10.10.8.193
!
interface GigabitEthernet0/1
 description Trunk uplink to distribution/core switch
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,50,60,70
 switchport trunk native vlan 999
 switchport nonegotiate
 no shutdown
!
interface FastEthernet0/1
 description Access port for Students
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface FastEthernet0/2
 description Access port for Staff
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface FastEthernet0/3
 description Access port for Labs
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface FastEthernet0/4
 description Access port for Wireless-APs
 switchport mode access
 switchport access vlan 40
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface FastEthernet0/5
 description Access port for VoIP
 switchport mode access
 switchport access vlan 50
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface FastEthernet0/6
 description Access port for Servers
 switchport mode access
 switchport access vlan 60
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface FastEthernet0/7
 description Access port for Management
 switchport mode access
 switchport access vlan 70
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
end
